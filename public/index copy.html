<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectWise Web Control Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Screen<span>Connect</span></h2>
            <nav>
                <a class="active">Live Relay</a>
                <a>Access Agents</a>
                <a>Audit Logs</a>
            </nav>
            <div class="status-box">
                <span id="netStatus" class="dot offline"></span>
                Socket: <strong id="statusText">Disconnected</strong>
            </div>
        </aside>

        <main>
            <header>
                <h1>Remote Control Console</h1>
                <p>Broadcast your workspace or monitor authorized incoming connections.</p>
            </header>

            <section class="control-panel">
                <div class="actions">
                    <button id="shareBtn" class="btn-primary">Broadcast My Screen</button>
                    <button id="stopBtn" class="btn-danger" disabled>Stop Feed</button>
                </div>
                <div class="stream-wrapper">
                    <h3>Remote Monitoring Canvas</h3>
                    <video id="remoteView" autoplay playsinline muted></video>
                    <canvas id="hiddenCanvas" style="display:none;"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}`);
        const shareBtn = document.getElementById('shareBtn');
        const stopBtn = document.getElementById('stopBtn');
        const remoteView = document.getElementById('remoteView');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');
        
        let localStream = null;
        let streamInterval = null;

        ws.onopen = () => {
            document.getElementById('netStatus').className = "dot online";
            document.getElementById('statusText').textContent = "Connected";
        };

        // TECHNICIAN SIDE: Receive screen snapshots from the other device
        ws.onmessage = async (event) => {
            if (typeof event.data === "string" && event.data.startsWith("data:image")) {
                const img = new Image();
                img.onload = () => {
                    hiddenCanvas.width = img.width;
                    hiddenCanvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                };
                img.src = event.data;
                // If remote video element isn't capturing a native stream, map the canvas snapshot
                if (!remoteView.srcObject) {
                    remoteView.poster = event.data;
                }
            }
        };

        // CLIENT SIDE: Capture screen and pipe frames over the server pipeline
        shareBtn.onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                remoteView.srcObject = localStream;
                
                shareBtn.disabled = true;
                stopBtn.disabled = false;

                const track = localStream.getVideoTracks()[0];
                const imageCapture = new ImageCapture(track);

                // Pipe images down the pipeline every 100ms (10 frames per second)
                streamInterval = setInterval(async () => {
                    if (track.readyState === 'live') {
                        try {
                            const bitmap = await imageCapture.grabFrame();
                            hiddenCanvas.width = bitmap.width;
                            hiddenCanvas.height = bitmap.height;
                            ctx.drawImage(bitmap, 0, 0);
                            const base64Frame = hiddenCanvas.toDataURL('image/jpeg', 0.4);
                            if (ws.readyState === WebSocket.OPEN) {
                                ws.send(base64Frame);
                            }
                        } catch (e) { console.log("Frame dropped"); }
                    }
                }, 100);

                track.onended = stopStreaming;
            } catch (err) {
                alert("Access denied or stream initialization canceled.");
            }
        };

        function stopStreaming() {
            clearInterval(streamInterval);
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            remoteView.srcObject = null;
            remoteView.poster = "";
            shareBtn.disabled = false;
            stopBtn.disabled = true;
        }

        stopBtn.onclick = stopStreaming;
    </script>
</body>
</html>
