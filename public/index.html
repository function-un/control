<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectWise Web Control Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Screen<span>Connect</span></h2>
            <nav>
                <a class="active">Interactive Relay</a>
                <a>Access Agents</a>
                <a>Audit Logs</a>
            </nav>
            <div class="status-box">
                <span id="netStatus" class="dot offline"></span>
                Socket: <strong id="statusText">Disconnected</strong>
            </div>
        </aside>

        <main>
            <header>
                <h1>Interactive Remote Console</h1>
                <p>Broadcast your workspace or click inside an incoming stream to interact.</p>
            </header>

            <section class="control-panel">
                <div class="actions">
                    <button id="shareBtn" class="btn-primary">Broadcast My Workspace</button>
                    <button id="stopBtn" class="btn-danger" disabled>Stop Feed</button>
                </div>
                <div class="stream-wrapper">
                    <h3>Remote Monitoring Canvas (Click Inside to Control)</h3>
                    <video id="remoteView" autoplay playsinline muted></video>
                    <canvas id="hiddenCanvas" style="display:none;"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Open WebSocket connection back to host server layer
        const ws = new WebSocket(`ws://${window.location.host}`);
        const shareBtn = document.getElementById('shareBtn');
        const stopBtn = document.getElementById('stopBtn');
        const remoteView = document.getElementById('remoteView');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');
        
        let localStream = null;
        let streamInterval = null;

        ws.onopen = () => {
            document.getElementById('netStatus').className = "dot online";
            document.getElementById('statusText').textContent = "Connected";
        };

        ws.onmessage = async (event) => {
            if (typeof event.data === "string" && event.data.startsWith("data:image")) {
                remoteView.poster = event.data;
            }
        };

        // INTERACTION LAYER: Intercept canvas clicks and match pixel metrics
        remoteView.addEventListener('click', (e) => {
            const rect = remoteView.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Calculate precise absolute target coordinate parameters based on screen geometry boundaries
            const mappedX = Math.round((clickX / rect.width) * window.screen.width);
            const mappedY = Math.round((clickY / rect.height) * window.screen.height);

            const clickPayload = { type: 'click', x: mappedX, y: mappedY };

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(clickPayload));
            }
        });

        // PLATFORM RUNTIME PROTECTION UTILITY
        function isMobileDevice() {
            return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
        }

        shareBtn.onclick = async () => {
            try {
                if (isMobileDevice()) {
                    // MOBILE FALLBACK ROUTINE: Map native rear array sensor feeds
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: 1280, height: 720 },
                        audio: false
                    });
                } else {
                    // DESKTOP AUTOMATION SPECIFICATION: Target the monitor workspace layer directly
                    localStream = await navigator.mediaDevices.getDisplayMedia({ 
                        video: { 
                            displaySurface: "monitor" 
                        }, 
                        audio: false 
                    });
                }

                remoteView.srcObject = localStream;
                shareBtn.disabled = true;
                stopBtn.disabled = false;

                const track = localStream.getVideoTracks();
                
                // Pipeline image data streaming engine loop sequence
                streamInterval = setInterval(async () => {
                    if (track[0].readyState === 'live') {
                        try {
                            hiddenCanvas.width = remoteView.videoWidth || 1280;
                            hiddenCanvas.height = remoteView.videoHeight || 720;
                            ctx.drawImage(remoteView, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                            
                            // Extract downsampled compression base64 strings to maximize low-latency socket responses
                            const base64Frame = hiddenCanvas.toDataURL('image/jpeg', 0.25);
                            if (ws.readyState === WebSocket.OPEN) {
                                ws.send(base64Frame);
                            }
                        } catch (e) { }
                    }
                }, 150);

                track[0].onended = stopStreaming;
            } catch (err) {
                console.error(err);
                alert("Stream context initialization rejected by browser policy rules.");
            }
        };

        function stopStreaming() {
            clearInterval(streamInterval);
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            remoteView.srcObject = null;
            remoteView.poster = "";
            shareBtn.disabled = false;
            stopBtn.disabled = true;
        }

        stopBtn.onclick = stopStreaming;
    </script>
</body>
</html>
