<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Operator Console | RMM Suite</title>
    <!-- Link to separated production styles -->
    <link rel="stylesheet" href="/style.css">
    <!-- Load Socket.IO Client Library provided natively by the cloud server -->
    <script src="/socket.io/socket.io.js" defer></script>
    <!-- Load modular client orchestration engine scripts -->
    <script src="/index.js" defer></script>
</head>
<body>

    <!-- Pillar 1: Deep Core System Routing Icons -->
    <div id="nav-pillar">
        <div class="pillar-icon active">🛡️</div>
        <div class="pillar-icon">📊</div>
        <div class="pillar-icon">⚡</div>
    </div>

    <!-- Pillar 2: Systems Explorer Panel Grid -->
    <div id="explorer-panel">
        <div class="explorer-header">
            <h2>Systems Architecture</h2>
            <div class="tab-ribbon">
                <button class="tab-btn active" id="btn-count-all">All Nodes (0)</button>
                <button class="tab-btn">Monitored</button>
            </div>
        </div>
        <div class="nodes-view-container" id="nodes-canvas-grid">
            <div class="stage-placeholder" style="padding-top: 40px;">Syncing cluster connections...</div>
        </div>
    </div>

    <!-- Pillar 3: High-Performance Main Workspace Console -->
    <div id="workspace-deck">
        <div id="deck-top-bar">
            <div class="meta-title">
                <span id="active-dot-status" class="status-dot status-online"></span>
                <span id="active-machine-title">Terminal Console Session</span>
            </div>
            <div class="ribbon-actions">
                <button class="btn-secondary" id="btn-sync-frame">⚡ Sync Frame</button>
                <button class="btn-premium" id="btn-session-trigger">Initialize Access</button>
            </div>
        </div>
        
        <!-- Action Control Menu Helper Utility Bar -->
        <div id="operator-ribbon">
            <div class="ribbon-tool" id="tool-cad">⌨️ Send Ctrl+Alt+Del</div>
            <div class="ribbon-tool" id="tool-run">🚀 Open Run Window</div>
            <div class="ribbon-tool" id="tool-terminate" style="color:var(--status-off);">🛑 Terminate Link</div>
        </div>
        
        <div id="viewport-stage">
            <div id="center-placeholder-msg" class="stage-placeholder">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <div>Select an active, authenticated endpoint profile from the systems explorer grid to establish a remote management session.</div>
            </div>
            
            <div id="canvas-frame-shield">
                <img id="stream-canvas-core" src="" alt="Active RMM Desktop Video Pipeline" />
            </div>
        </div>
    </div>

</body>
</html>
